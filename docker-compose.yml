services:
    # PHP-FPM + Laravel
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: painting-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html:cached
            - ./.env:/var/www/html/.env
        depends_on:
            - db
        networks:
            - painting-net

    # Nginx Web Server
    nginx:
        image: nginx:alpine
        container_name: painting-nginx
        restart: unless-stopped
        ports:
            - "8001:80"
        volumes:
            - ./:/var/www/html:cached
            - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - painting-net

    # PostgreSQL Database
    db:
        image: postgres:16-alpine
        container_name: painting-db
        restart: unless-stopped
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: painting
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: diidmsi
        volumes:
            - painting_db_data:/var/lib/postgresql/data
        networks:
            - painting-net

networks:
    painting-net:
        driver: bridge

volumes:
    painting_db_data:
